version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: ethi_pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ethi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ethi}
      POSTGRES_DB: ${POSTGRES_DB:-ethi_commerce}
    ports:
      - "5543:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-ethi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ethi_redis
    ports:
      - "6381:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://ethi:ethi@postgres:5432/ethi_commerce?schema=public}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change_me}
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:


